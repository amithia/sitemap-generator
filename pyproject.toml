[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitemap-generator"
version = "0.1.0"
description = "Crawl a website and generate a verified, interactive sitemap"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Amithi Liyanagamage" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.3"]
js = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/amithia/sitemap-generator"

[project.scripts]
sitemap-generator = "sitemap_generator.cli:main"

[tool.setuptools.packages.find]
include = ["sitemap_generator*"]

[tool.setuptools.package-data]
sitemap_generator = ["templates/*.html"]

[tool.ruff]
target-version = "py310"
